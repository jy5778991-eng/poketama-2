<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포케타마 2.0 | 배틀 프리뷰</title><link rel="stylesheet" href="style.css"></head><body><main class="game"><header><div class="eyebrow">POKETAMA 2.0 · PLAYTEST 01</div><h1>포케타마 <span>2.0</span></h1><p>네 가지 기술을 골라 싸우는 턴제 배틀 프로토타입</p></header><section class="arena"><div class="info right"><div class="name">야생 리자몽 <small>Lv.50</small></div><div class="hp"><div id="enemyBar"></div></div><div id="enemyHp" class="number"></div><span id="enemyStatus" class="status"></span></div><div class="sprite enemy" aria-label="상대 포켓몬">🔥</div><div class="ground"></div><div class="sprite player" aria-label="내 포켓몬">⚡</div><div class="info left"><div class="name">라이츄 <small>Lv.50</small></div><div class="hp"><div id="playerBar"></div></div><div id="playerHp" class="number"></div><span id="playerStatus" class="status"></span></div></section><section class="panel"><div class="panel-head"><b>라이츄는 무엇을 할까?</b><span id="turn">TURN 01</span></div><div id="moves" class="moves"></div><div class="toolbar"><button id="potion" class="secondary">💊 회복약 ×3 (+100 HP)</button><button id="restart" class="secondary">↻ 다시 시작</button></div></section><section class="logpanel"><h2>배틀 기록</h2><div id="log" class="log" aria-live="polite"></div></section><footer>DEMO · 배틀 화면 및 일부 전투 규칙 테스트용 · 정식 게임 아님</footer></main><script type="module" src="app.js"></script></body></html>
