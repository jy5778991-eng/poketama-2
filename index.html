<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포케타마 2.0 | BW 전투 프리뷰</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="game">
<header><div class="eyebrow">POKETAMA 2.0 · BLACK & WHITE PREVIEW</div><h1>포케타마 <span>2.0</span></h1><p>스타팅을 골라 전투를 체험해 봐! · 개발 중인 테스트 버전</p></header>
<section class="pick-panel"><h2>스타팅 선택 <small>현재는 Lv.50 임시 전투 · 육성 기능은 다음 업데이트</small></h2><div id="starters" class="starters"></div></section>
<section class="arena" aria-label="포켓몬 배틀">
<div class="battle-info enemy-info"><div class="name"><strong id="enemyName">리자몽</strong><small>Lv.50</small></div><div class="hp"><div id="enemyBar"></div></div><div id="enemyHp" class="number"></div><span id="enemyStatus" class="status"></span></div>
<div class="platform enemy-platform"></div><div class="sprite enemy"><img id="enemySprite" alt="상대 포켓몬" /><span id="enemyFallback" class="fallback">🔥</span><div id="enemyPopup" class="damage-popup" aria-hidden="true"></div></div>
<div class="platform player-platform"></div><div class="sprite player"><img id="playerSprite" alt="내 포켓몬"/><span id="playerFallback" class="fallback">⚡</span><div id="playerPopup" class="damage-popup" aria-hidden="true"></div></div>
<div class="battle-info player-info"><div class="name"><strong id="playerName">라이츄</strong><small>Lv.50</small></div><div class="hp"><div id="playerBar"></div></div><div id="playerHp" class="number"></div><span id="playerStatus" class="status"></span></div>
</section>
<section class="panel"><div class="panel-head"><b><span id="promptName">라이츄</span>는 무엇을 할까?</b><span id="turn">TURN 01</span></div>
<div id="moves" class="moves"></div><div class="toolbar"><button id="potion" class="secondary">회복약 ×3</button><button id="restart" class="secondary">↻ 다시 대결</button></div></section>
<section class="logpanel"><h2>배틀 기록</h2><div id="log" class="log" aria-live="polite"></div></section>
<footer>팬 제작 전투 프로토타입 · 공식 포켓몬 게임과 무관 · 스프라이트 제공 여부에 따라 대체 이미지 표시</footer>
</main><script type="module" src="./app.js"></script></body></html>
